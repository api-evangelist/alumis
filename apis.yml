aid: alumis
name: Alumis
description: 'Alumis Inc. (NASDAQ: ALMS) is a clinical-stage biopharmaceutical company
  headquartered at 280 East Grand Avenue, South San Francisco, California, developing
  oral therapies for immune-mediated diseases. Incorporated in 2021 as Esker Therapeutics
  and renamed Alumis in January 2022, its pipeline is led by envudeucitinib, an oral
  allosteric TYK2 inhibitor in Phase 3 for moderate-to-severe plaque psoriasis and
  systemic lupus erythematosus; A-005, a CNS-penetrant TYK2 inhibitor for neuroinflammatory
  and neurodegenerative disease; and lonigutamab, a subcutaneously delivered anti-IGF-1R
  antibody for thyroid eye disease. Alumis describes a proprietary precision data-analytics
  platform that integrates genetic, genomic, proteomic, biological and clinical insight,
  but it is an internal therapeutic-development capability and is not exposed publicly.
  The company publishes no developer portal, API documentation, SDKs or machine-readable
  specifications.'
